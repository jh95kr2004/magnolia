apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnolia-master
  labels:
    app: magnolia-master
spec:
  replicas: 2 # Increased to 2 for graceful updates. TODO: Add LoadBalancer/Ingress for user webapp routing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: magnolia-master
  template:
    metadata:
      labels:
        app: magnolia-master
    spec:
      containers:
      - name: master
        image: magnolia-master:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
        - containerPort: 8080
        env:
        - name: SERVER_VERSION
          value: "v1.0.0"
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ENGINE_REGION
          value: "KR"
        - name: POSTGRES_DSN
          value: "host=postgres-service user=magnolia_user password=magnolia_password dbname=magnolia_db port=5432 sslmode=disable"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: ENCRYPTION_MASTER_KEY
          value: "12345678901234567890123456789012"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 60 && echo 'Gracefully waited for active trades to close before stopping Master.'"]
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: master-service
spec:
  selector:
    app: magnolia-master
  ports:
  - protocol: TCP
    port: 50051
    targetPort: 50051
  - protocol: TCP
    port: 8080
    targetPort: 8080
