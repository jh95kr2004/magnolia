server {
    listen 80;
    server_name your_domain.com; # 여기에 실제 도메인이나 서버 IP를 입력하세요.

    # 1. Magnolia Unified Trading Node (Frontend & REST/WS API)
    # Proxiess SPA assets and API endpoints to port 8081
    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE Streaming Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE Streaming Buffer & Timeout Config
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        chunked_transfer_encoding on;
    }

    # 2. Go Backend REST API & Server-Sent Events (SSE)
    location /api/ {
        proxy_pass http://localhost:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 스트리밍을 위한 버퍼링 비활성화 및 타임아웃 방지
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;     # 연결 유지 시간 증가
        proxy_send_timeout 86400;
        chunked_transfer_encoding on;
    }

    # 프로덕션 환경(npm run build)일 경우에는 아래의 프론트엔드 설정을 사용하세요.
    # location / {
    #     root /home/jh95kr2004/Workspace/magnolia/frontend/dist;
    #     index index.html index.htm;
    #     try_files $uri $uri/ /index.html;
    # }
}
